version: '3.8'

services:
  # (MySQL)
  db:
    image: mysql:8.0
    container_name: taskflow-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: taskflow_db
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - taskflow-net

  # (Backend)
  backend:
    build:
      context: ./taskflow-backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=taskflow_db
    depends_on:
      - db
    networks:
      - taskflow-net

  #  (Frontend)
  frontend:
    build:
      context: ./frontend  # ادخل جوه مجلد الـ frontend الأول
      dockerfile: Dockerfile # الملف موجود جواه مباشرة
    container_name: taskflow-ui
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - taskflow-net

networks:
  taskflow-net:
    driver: bridge